# VM Tech: build "VM Tech Remote" (clients) + "VM Tech Staff" (staff) for Windows x64.
# Same program; each zip gets its own signed custom.txt (see vmtech/README.md).
# Run it: GitHub → Actions → "VM Tech Windows build" → Run workflow. Takes ~40–60 min the first time.
name: VM Tech Windows build

on:
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-topmost:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    needs: [generate-bridge, build-topmost]
    runs-on: windows-2022
    env:
      HAS_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' && 'yes' || 'no' }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: VM Tech logo into the app
        shell: bash
        run: |
          cp vmtech/icon.png flutter/assets/icon.png
          cp vmtech/logo.png flutter/assets/logo.png
          grep -q 'n+cqdRNxSjVwOBY6glqlcIUCtLb3T9yXf0K6bCxKBAQ=' src/common.rs || { echo "VM Tech key missing in src/common.rs"; exit 1; }

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      # Windows Smart App Control blocks unsigned programs AND unsigned DLLs, so sign every .exe/.dll we ship
      # with VM Tech's Azure Artifact Signing (same account as the VM Tech Remote installer).
      # Needs the fork's Actions secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET.
      - name: Sign the program files (Azure Artifact Signing)
        if: ${{ env.HAS_SIGNING == 'yes' }}
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: vmtechsigning
          certificate-profile-name: vmtech-public
          files-folder: ${{ github.workspace }}\rustdesk
          files-folder-filter: dll,exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signature
        if: ${{ env.HAS_SIGNING == 'yes' }}
        shell: pwsh
        run: |
          $bad = Get-ChildItem ./rustdesk -Recurse -Include *.exe,*.dll | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          $bad | ForEach-Object { "NOT SIGNED: $($_.FullName)" }
          (Get-AuthenticodeSignature ./rustdesk/rustdesk.exe) | Format-List Status, SignerCertificate
          if ($bad) { exit 1 }

      - name: Make the two VM Tech apps
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          foreach ($v in @(@{name='VMTechRemote-client'; exe='VMTechRemote.exe'; cfg='vmtech/custom-client.txt'}, @{name='VMTechStaff'; exe='VMTechStaff.exe'; cfg='vmtech/custom-staff.txt'})) {
            $dir = "out/$($v.name)"
            Copy-Item -Recurse ./rustdesk $dir
            Rename-Item "$dir/rustdesk.exe" $v.exe
            Copy-Item $v.cfg "$dir/custom.txt"
            Copy-Item LICENCE "$dir/LICENCE-RustDesk-AGPL.txt"
            Compress-Archive -Path "$dir/*" -DestinationPath "out/$($v.name)-windows-x64.zip"
          }
          Get-ChildItem out/*.zip | ForEach-Object { "{0}  {1:N1} MB  {2}" -f $_.Name, ($_.Length/1MB), (Get-FileHash $_ -Algorithm SHA256).Hash }

      - name: Upload VM Tech Remote (clients)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VMTechRemote-client-windows-x64
          path: out/VMTechRemote-client-windows-x64.zip
          if-no-files-found: error

      - name: Upload VM Tech Staff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VMTechStaff-windows-x64
          path: out/VMTechStaff-windows-x64.zip
          if-no-files-found: error
