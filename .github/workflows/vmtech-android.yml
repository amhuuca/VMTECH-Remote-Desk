# VM Tech: build "VM TECH Staff-RS" for technicians' Android phones (one APK for arm64 + armv7 phones).
# Same as the Windows staff app: vmtech/custom-staff.txt (signed) is built into the APK, so it uses
# rd.vmtech.ca and VM Tech's key, and it only connects OUT to clients' computers.
# Run it: GitHub → Actions → "VM Tech Android build" → Run workflow. Takes ~40–60 min the first time.
# Output: VMTechStaff-android.apk on the public release "client-latest".
# Signing: if the secrets ANDROID_SIGNING_KEY / ANDROID_ALIAS / ANDROID_KEY_STORE_PASSWORD / ANDROID_KEY_PASSWORD
# exist, the APK is signed with that key (updates install over the old app). Otherwise it uses a
# throw-away debug key (fine for testing; uninstall the old app before installing a new build).
name: VM Tech Android build

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-lib:
    needs: [generate-bridge]
    name: build lib ${{ matrix.job.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        job:
          - { target: aarch64-linux-android, abi: arm64-v8a, script: ndk_arm64.sh }
          - { target: armv7-linux-androideabi, abi: armeabi-v7a, script: ndk_arm.sh }
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib libclang-dev \
               llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: VM Tech key check
        run: grep -q 'n+cqdRNxSjVwOBY6glqlcIUCtLb3T9yXf0K6bCxKBAQ=' src/common.rs || { echo "VM Tech key missing in src/common.rs"; exit 1; }

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "$f:"; cat "$f"; done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: vmtech-android
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ matrix.job.script }}

      - name: Upload lib
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lib-${{ matrix.job.abi }}
          path: ./target/${{ matrix.job.target }}/release/liblibrustdesk.so

  build-apk:
    needs: [build-lib]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_SIGNING_KEY != '' && 'yes' || 'no' }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Download arm64 lib
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lib-arm64-v8a
          path: ./flutter/android/app/src/main/jniLibs/arm64-v8a

      - name: Download armv7 lib
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lib-armeabi-v7a
          path: ./flutter/android/app/src/main/jniLibs/armeabi-v7a

      - name: VM Tech branding and settings
        shell: bash
        run: |
          set -e
          CFG=$(tr -d '\r\n' < vmtech/custom-staff.txt)
          [ -n "$CFG" ] || { echo "vmtech/custom-staff.txt is empty"; exit 1; }
          # The signed VM Tech settings go into both places the Android app starts the core.
          f=flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt
          grep -q 'FFI.startServer(configPath, homePath, "")' "$f"
          sed -i "s|FFI.startServer(configPath, homePath, \"\")|FFI.startServer(configPath, homePath, \"$CFG\")|" "$f"
          f=flutter/lib/models/native_model.dart
          grep -q "customClientConfig: ''," "$f"
          sed -i "s|customClientConfig: '',|customClientConfig: '$CFG',|" "$f"
          # Own app id, so it installs next to (not over) the normal RustDesk app.
          sed -i 's|applicationId "com.carriez.flutter_hbb"|applicationId "ca.vmtech.staff"|' flutter/android/app/build.gradle
          grep -q 'applicationId "ca.vmtech.staff"' flutter/android/app/build.gradle
          # Name shown under the icon, and in Settings → Accessibility.
          sed -i 's|android:label="RustDesk Input"|android:label="VM Tech Input"|; s|android:label="RustDesk"|android:label="VM TECH Staff-RS"|' flutter/android/app/src/main/AndroidManifest.xml
          grep -q 'VM TECH Staff-RS' flutter/android/app/src/main/AndroidManifest.xml
          # The portal's Connect button opens vmtechstaff://connection/new/<ID> (same link as the Windows staff app).
          sed -i 's|<data android:scheme="rustdesk" />|<data android:scheme="vmtechstaff" />|' flutter/android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="vmtechstaff"' flutter/android/app/src/main/AndroidManifest.xml
          # Logo: app icon + in-app logo.
          cp -r vmtech/android/res/. flutter/android/app/src/main/res/
          sed -i 's|<color name="ic_launcher_background">#ffffff</color>|<color name="ic_launcher_background">#5a0f26</color>|' flutter/android/app/src/main/res/values/*.xml
          cp vmtech/icon.png flutter/assets/icon.png
          cp vmtech/logo.png flutter/assets/logo.png
          # Title at the top of the app: "VM Tech Staff" (the signed settings keep the name VMTechStaff).
          f=flutter/lib/mobile/pages/home_page.dart
          grep -q 'return Text(bind.mainGetAppNameSync());' "$f"
          sed -i "s|return Text(bind.mainGetAppNameSync());|return Text('VM Tech Staff');|" "$f"
          # "Powered by RustDesk" is already the tagline in the VM TECH logo; drop the extra link in Settings.
          f=flutter/lib/mobile/pages/settings_page.dart
          grep -q 'child: loadPowered(context),' "$f"
          sed -i 's|child: loadPowered(context),|child: const SizedBox.shrink(),|' "$f"

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          J=./flutter/android/app/src/main/jniLibs
          mv $J/arm64-v8a/liblibrustdesk.so $J/arm64-v8a/librustdesk.so
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so $J/arm64-v8a/
          mv $J/armeabi-v7a/liblibrustdesk.so $J/armeabi-v7a/librustdesk.so
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so $J/armeabi-v7a/
          pushd flutter
          flutter build apk --release --target-platform android-arm64,android-arm
          popd
          mkdir -p out
          mv flutter/build/app/outputs/flutter-apk/app-release.apk out/VMTechStaff-android.apk

      - name: Setup sign tool version variable
        if: env.HAS_SIGNING == 'yes'
        shell: bash
        run: echo "ANDROID_SIGN_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)" >> $GITHUB_ENV

      - uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        name: Sign APK with VM Tech key
        if: env.HAS_SIGNING == 'yes'
        id: sign
        with:
          releaseDirectory: ./out
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}

      - name: Use signed APK
        if: env.HAS_SIGNING == 'yes'
        shell: bash
        run: mv -f "${{ steps.sign.outputs.signedReleaseFile }}" out/VMTechStaff-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VMTechStaff-android
          path: out/VMTechStaff-android.apk

      - name: Publish (release client-latest)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view client-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create client-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "VM Tech Desk (client) - latest" --notes "VM Tech client apps."
          gh release upload client-latest out/VMTechStaff-android.apk --clobber --repo "$GITHUB_REPOSITORY"
